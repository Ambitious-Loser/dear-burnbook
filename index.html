<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>Anh 2 maimai - "Tôi không làm nô lệ cho lời nói"</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #desk {
            position: relative;
            height: 100vh;
            height: 100dvh;
            background-color: #5c3a21;
            background-image: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%),
                              url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: none;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        #zoom-wrapper {
            transform-origin: center center;
            will-change: transform;
        }

        #flipbook {
            filter: drop-shadow(0 20px 20px rgba(0, 0, 0, 0.5));
            transition: transform 0.8s ease-in-out;
        }

        .page {
            background-color: #faf6ee;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .page.cover {
            background-color: #2a1f1d;
        }

        .full-page {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        #controls {
            position: absolute;
            bottom: max(6%, 40px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: rgba(232, 216, 184, 0.7);
            font-size: 15px;
            letter-spacing: 1px;
            z-index: 10;
        }

        #controls button {
            background: transparent;
            border: 1px solid rgba(232, 216, 184, 0.4);
            color: rgba(232, 216, 184, 0.7);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        #controls button:hover {
            background: rgba(232, 216, 184, 0.15);
            color: #ffffff;
            border-color: #ffffff;
        }

        .counter-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .page-label {
            margin-right: 6px;
            color: rgba(232, 216, 184, 0.7);
        }

        #page-input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed transparent;
            color: rgba(232, 216, 184, 0.7);
            font-family: inherit;
            font-size: 15px;
            text-align: center;
            width: 65px;
            outline: none;
            transition: all 0.3s ease;
        }

        #page-input:hover, #page-input:focus {
            border-bottom-color: rgba(232, 216, 184, 0.4);
            color: #ffffff;
        }

        #error-msg {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 8px;
            color: #ff6b6b;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        #zoom-controls {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 20;
        }

        #zoom-controls button {
            background: transparent;
            border: 1px solid rgba(232, 216, 184, 0.4);
            color: rgba(232, 216, 184, 0.7);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: inherit;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        #zoom-controls button:hover {
            background: rgba(232, 216, 184, 0.15);
            color: #ffffff;
            border-color: #ffffff;
        }

        #nudge-text {
            position: absolute;
            bottom: max(2%, 14px);
            color: rgba(232, 216, 184, 0.6);
            font-size: 13px;
            letter-spacing: 1px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease; 
        }

        @keyframes pulse-fade {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        @media (max-height: 500px) {
            #controls {
                bottom: 8px;
                gap: 10px;
                font-size: 13px;
            }
            #controls button {
                width: 26px;
                height: 26px;
                font-size: 12px;
            }
            #page-input {
                font-size: 13px;
                width: 55px;
            }
            #nudge-text {
                display: none;
            }
            #zoom-controls {
                right: 10px;
                gap: 8px;
            }
            #zoom-controls button {
                width: 30px;
                height: 30px;
                font-size: 16px;
            }
        }

        @media (max-width: 600px) {
            #zoom-controls {
                right: 12px;
            }
            #controls {
                gap: 10px;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let calcWidth, calcHeight, shiftAmount;

            function calculateDimensions() {
                const isMobileLandscape = window.innerHeight < 500 && window.innerWidth > window.innerHeight;
                const maxSpreadWidth = isMobileLandscape ? (window.innerWidth - 80) * 0.94 : window.innerWidth * 0.92;
                const maxHeight = isMobileLandscape ? window.innerHeight * 0.70 : window.innerHeight * 0.65;
                const maxWidthSingle = maxSpreadWidth / 2;
                const aspectRatio = 400 / 575;

                calcHeight = Math.min(maxHeight, maxWidthSingle / aspectRatio);
                calcWidth = calcHeight * aspectRatio;
                shiftAmount = calcWidth / 2;
            }

            calculateDimensions();

            const flipbookElements = document.querySelectorAll('.page');
            const flipbookEl = document.getElementById('flipbook');
            const zoomWrapper = document.getElementById('zoom-wrapper');
            const totalPages = flipbookElements.length;
            
            flipbookEl.style.transform = `translateX(-${shiftAmount}px)`;

            const pageFlip = new St.PageFlip(flipbookEl, {
                width: calcWidth,
                height: calcHeight,
                size: "fixed",
                minWidth: calcWidth,
                maxWidth: calcWidth,
                minHeight: calcHeight,
                maxHeight: calcHeight,
                drawShadow: true,
                showCover: true,
                usePortrait: false,
                flippingTime: 800
            });

            pageFlip.loadFromHTML(flipbookElements);

            const pageInput = document.getElementById('page-input');
            const pageTotal = document.getElementById('page-total');
            const errorMsg = document.getElementById('error-msg');
            
            pageTotal.textContent = ` / ${totalPages}`;
            pageInput.value = 'Bìa';

            function applyTransform(targetPage) {
                if (targetPage === 0) {
                    flipbookEl.style.transform = `translateX(-${shiftAmount}px)`;
                } else if (targetPage === totalPages - 1) {
                    flipbookEl.style.transform = `translateX(${shiftAmount}px)`;
                } else {
                    flipbookEl.style.transform = 'translateX(0)';
                }
            }
            
            function setInputDisplay(index) {
                if (index === 0) {
                    pageInput.value = 'Bìa';
                } else if (index === totalPages - 1) {
                    pageInput.value = 'Cuối';
                } else {
                    pageInput.value = `${index + 1}–${index + 2}`;
                }
            }

            let zoomLevel = 1;
            let isPanning = false;
            let startX, startY, panX = 0, panY = 0;
            let initialPinchDistance = 0;
            let initialPinchZoom = 1;

            function updateZoom(animate = true) {
                zoomWrapper.style.transition = animate ? 'transform 0.25s ease' : 'none';
                zoomWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
            }

            function setZoom(newZoom, animate = true) {
                zoomLevel = Math.max(1, Math.min(newZoom, 3));
                if (zoomLevel === 1) {
                    panX = 0;
                    panY = 0;
                }
                updateZoom(animate);
            }
            
            pageFlip.on('flip', function(e) {
                if (zoomLevel > 1) {
                    setZoom(1, true);
                }
                applyTransform(e.data);
                setInputDisplay(e.data);
                errorMsg.style.opacity = '0';
            });

            pageFlip.on('changeState', function(e) {
                if (e.data === 'flipping') {
                    const sfx = document.getElementById('page-sfx');
                    if (sfx) {
                        sfx.currentTime = 0;
                        sfx.play().catch(function(err) {});
                    }
                }
                if (e.data === 'read') {
                    applyTransform(pageFlip.getCurrentPageIndex());
                }
            });

            function processJump() {
                let val = pageInput.value.trim().toLowerCase();
                let targetIndex = -1;

                if (val === 'cover' || val === 'bìa') {
                    targetIndex = 0;
                } else if (val === 'end' || val === 'back' || val === 'cuối') {
                    targetIndex = totalPages - 1;
                } else {
                    let match = val.match(/^(\d+)(?:\s*(?:-|–)\s*\d+)?$/);
                    if (match) {
                        let pageNum = parseInt(match[1], 10);
                        if (pageNum >= 1 && pageNum <= totalPages) {
                            targetIndex = pageNum - 1;
                            if (targetIndex > 0 && targetIndex < totalPages - 1 && targetIndex % 2 === 0) {
                                targetIndex -= 1; 
                            }
                        }
                    }
                }

                if (targetIndex !== -1) {
                    errorMsg.style.opacity = '0';
                    if (targetIndex !== pageFlip.getCurrentPageIndex()) {
                        if (zoomLevel > 1) {
                            setZoom(1, true);
                        }
                        pageFlip.turnToPage(targetIndex);
                        applyTransform(targetIndex);
                        setInputDisplay(targetIndex);
                    } else {
                        setInputDisplay(targetIndex);
                    }
                } else {
                    errorMsg.style.opacity = '1';
                }
            }

            pageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    processJump();
                    pageInput.blur();
                }
            });

            pageInput.addEventListener('blur', processJump);
            pageInput.addEventListener('input', function() {
                errorMsg.style.opacity = '0';
            });

            document.getElementById('prev-btn').addEventListener('click', function() {
                pageFlip.flipPrev();
            });

            document.getElementById('next-btn').addEventListener('click', function() {
                pageFlip.flipNext();
            });

            document.addEventListener('keydown', function(e) {
                if (document.activeElement === pageInput) return;
                if (e.key === 'ArrowLeft') {
                    pageFlip.flipPrev();
                    clearNudge();
                } else if (e.key === 'ArrowRight') {
                    pageFlip.flipNext();
                    clearNudge();
                }
            });

            document.getElementById('btn-zoom-in').addEventListener('click', function() {
                setZoom(zoomLevel + 0.5, true);
            });

            document.getElementById('btn-zoom-out').addEventListener('click', function() {
                setZoom(zoomLevel - 0.5, true);
            });

            window.addEventListener('wheel', function(e) {
                if (e.ctrlKey || Math.abs(e.deltaY) > 0) {
                    e.preventDefault();
                    const delta = e.deltaY < 0 ? 0.2 : -0.2;
                    setZoom(zoomLevel + delta, true);
                }
            }, { passive: false });

            zoomWrapper.addEventListener('mousedown', function(e) {
                if (zoomLevel > 1) {
                    isPanning = true;
                    startX = e.clientX - panX;
                    startY = e.clientY - panY;
                    zoomWrapper.style.cursor = 'grabbing';
                    e.stopPropagation(); 
                }
            }, true); 

            window.addEventListener('mousemove', function(e) {
                if (!isPanning) return;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateZoom(false);
            });

            window.addEventListener('mouseup', function() {
                if (isPanning) {
                    isPanning = false;
                    zoomWrapper.style.cursor = 'auto';
                    updateZoom(false);
                }
            });

            function getTouchDistance(touches) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            window.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    initialPinchDistance = getTouchDistance(e.touches);
                    initialPinchZoom = zoomLevel;
                    isPanning = false;
                    e.preventDefault();
                } else if (e.touches.length === 1 && zoomLevel > 1) {
                    isPanning = true;
                    startX = e.touches[0].clientX - panX;
                    startY = e.touches[0].clientY - panY;
                    e.stopPropagation();
                }
            }, { passive: false, capture: true });

            window.addEventListener('touchmove', function(e) {
                if (e.touches.length === 2 && initialPinchDistance > 0) {
                    e.preventDefault();
                    const currentDistance = getTouchDistance(e.touches);
                    const scaleFactor = currentDistance / initialPinchDistance;
                    setZoom(initialPinchZoom * scaleFactor, false);
                } else if (e.touches.length === 1 && isPanning && zoomLevel > 1) {
                    e.preventDefault();
                    panX = e.touches[0].clientX - startX;
                    panY = e.touches[0].clientY - startY;
                    updateZoom(false);
                }
            }, { passive: false });

            window.addEventListener('touchend', function(e) {
                if (e.touches.length < 2) {
                    initialPinchDistance = 0;
                }
                if (e.touches.length === 0) {
                    isPanning = false;
                    updateZoom(false);
                }
            });

            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    calculateDimensions();
                    if (typeof pageFlip.update === 'function') {
                        pageFlip.update({
                            width: calcWidth,
                            height: calcHeight,
                            minWidth: calcWidth,
                            maxWidth: calcWidth,
                            minHeight: calcHeight,
                            maxHeight: calcHeight
                        });
                    }
                    applyTransform(pageFlip.getCurrentPageIndex());
                    
                    if (zoomLevel > 1) {
                        setZoom(1, true);
                    }
                }, 250);
            });

            let interactionFired = false;
            const nudgeEl = document.getElementById('nudge-text');
            
            const startPulse = setTimeout(function() {
                if (!interactionFired && nudgeEl) {
                    nudgeEl.style.animation = 'pulse-fade 3s infinite ease-in-out';
                }
            }, 4000);

            const lockSolid = setTimeout(function() {
                if (!interactionFired && nudgeEl) {
                    nudgeEl.style.animation = 'none';
                    nudgeEl.style.opacity = '1';
                }
            }, 12000);

            function clearNudge() {
                if (interactionFired) return;
                interactionFired = true;
                
                clearTimeout(startPulse);
                clearTimeout(lockSolid);
                
                if (nudgeEl) {
                    const currentOpacity = window.getComputedStyle(nudgeEl).opacity;
                    nudgeEl.style.animation = 'none';
                    nudgeEl.style.opacity = currentOpacity;
                    
                    void nudgeEl.offsetWidth; 
                    nudgeEl.style.opacity = '0';
                }
                
                document.removeEventListener('mousedown', clearNudge);
                document.removeEventListener('touchstart', clearNudge);
            }

            document.addEventListener('mousedown', clearNudge);
            document.addEventListener('touchstart', clearNudge);
        });
    </script>
</body>
</html>
